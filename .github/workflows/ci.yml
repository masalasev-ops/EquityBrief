name: ci
on: [push, pull_request]

jobs:
  # Windows is a supported platform and is not verified here. It is verified on
  # the operator's machine, where the nightly job runs, by tools/ci.ps1, and
  # each checkpoint's record says so, which two-platform reads. The hosted
  # Windows runner was removed on 2026-09-15 by the operator's ruling, having
  # taken up to half an hour for a suite that runs in about a minute there.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changelog-reconciles reads the history. The default shallow clone
          # gives it one commit, and a check that cannot see what it asserts
          # over must fail rather than pass over nothing.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: verify
        run: ./tools/ci.sh

  # Linux is not a platform this tool supports. This job exists as an instrument
  # for one class of fault: a path written with the wrong case works on Windows
  # and macOS, which are case-insensitive by default, and fails on a
  # case-sensitive filesystem. two-platform still claims exactly what it says.
  case-sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changelog-reconciles reads the history. The default shallow clone
          # gives it one commit, and a check that cannot see what it asserts
          # over must fail rather than pass over nothing.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./tools/ci.sh
